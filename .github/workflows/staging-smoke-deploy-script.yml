name: Staging - Smoke (Deploy script stub)

on:
  workflow_dispatch: # Manual trigger so we can test safely without touching services

jobs:
  smoke:
    runs-on: [self-hosted, windows, staging]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 # Pulls the repo onto the staging server runner workspace

      - name: Run deploy script stub (Windows PowerShell)
        shell: powershell
        run: |
          # Run the stub script from the repo (executes on the staging server runner)
          # Using Windows PowerShell because pwsh is not available on this server.
          .\infra\deploy\Deploy-Service.ps1 `
            -Env staging `
            -Service auth `
            -Version "0.0.0-smoke"
            -CheckServy

