name: _deploy

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      env_root:
        required: true
        type: string
      flyway_env:
        required: true
        type: string
      winsw_suffix:
        required: true
        type: string
      health_port_base:
        required: true
        type: number

jobs:
  deploy:
    runs-on: [self-hosted, windows]
    environment: ${{ inputs.environment }}
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      ENV_ROOT: ${{ inputs.env_root }}
      WINSW_SUFFIX: ${{ inputs.winsw_suffix }}
      HEALTH_PORT_BASE: ${{ inputs.health_port_base }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Python matches .python-version
        run: |
          $expected = (Get-Content .python-version -Raw).Trim()
          $actual = (python -c "import platform; print(platform.python_version())").Trim()
          Write-Host "Expected: $expected"
          Write-Host "Actual:   $actual"
          if ($expected -ne $actual) { throw "Python version mismatch. Expected $expected, got $actual" }

      - name: Compute release version
        run: |
          $ShortSha = "${{ github.sha }}".Substring(0,7)
          $Version = (Get-Content "backend/auth/VERSION" -Raw).Trim()

          "REL_VERSION=$Version+$ShortSha"    | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "REL_COMMIT_SHORT=$ShortSha"        | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Publish .NET services (Release)
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet publish ".\backend\auth\AuthService\AuthService.csproj" -c Release -r win-x64 --self-contained true -o ".\_out\auth\app"
          dotnet publish ".\backend\pdf-renderer\PdfRendererService\PdfRendererService.csproj" -c Release -r win-x64 --self-contained true -o ".\_out\pdf-renderer\app"

      - name: Stage text2image source
        run: |
          New-Item -ItemType Directory -Force -Path ".\_out\text2image" | Out-Null
          Copy-Item ".\backend\text2image\*" ".\_out\text2image" -Recurse -Force

      - name: Stage viber-automation source
        run: |
          New-Item -ItemType Directory -Force -Path ".\_out\viber-automation" | Out-Null
          Copy-Item ".\backend\viber-automation\*" ".\_out\viber-automation" -Recurse -Force

      - name: Run Flyway migrations
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          flyway -environment=${{ inputs.flyway_env }} migrate
        working-directory: backend/shared

      # Phase 1: build every release folder while the services keep running.
      # If anything fails here, nothing live has been touched.
      - name: Prepare releases (services still running)
        run: |
          . .\.github\scripts\deploy-common.ps1
          Remove-Item $StateFile -ErrorAction SilentlyContinue   # never reuse state from an older run

          foreach ($svc in $Services) {
            Write-Host "=== Prepare $($svc.Name) $Version ==="
            Ensure-Dirs $svc
            $releaseDir = Join-Path (Get-SvcRoot $svc) "releases\$Version"
            $appDir     = Join-Path $releaseDir 'app'

            if ((Get-CurrentTarget $svc) -eq (Normalize-Path $releaseDir)) {
              Write-Host "$($svc.Name): $Version is already live, skipping prepare"
              continue
            }
            if (Test-Path $releaseDir) { Remove-Item $releaseDir -Recurse -Force }

            New-Item -ItemType Directory -Force -Path $appDir | Out-Null
            Copy-Item "$($svc.Source)\*" $appDir -Recurse -Force

            if ($svc.Venv) {
              $venv = Join-Path $releaseDir 'venv'
              $venvPython = Join-Path $venv 'Scripts\python.exe'
              python -m venv $venv
              & $venvPython -m pip install --upgrade pip
              & $venvPython -m pip install -r (Join-Path $appDir 'requirements.txt')
            }
          }

      # Phase 2: the actual switch. Only stop -> repoint junction -> start per service.
      - name: Activate releases
        run: |
          . .\.github\scripts\deploy-common.ps1
          $state = @{}

          foreach ($svc in $Services) {
            Write-Host "=== Activate $($svc.Name) $Version ==="
            $releaseDir = Join-Path (Get-SvcRoot $svc) "releases\$Version"

            # Record the rollback target BEFORE touching the service.
            $state[$svc.Name] = Get-CurrentTarget $svc
            $state | ConvertTo-Json | Set-Content -Path $StateFile -Encoding utf8

            Stop-Svc $svc
            Set-CurrentJunction $svc $releaseDir
            Start-Svc $svc
          }

      - name: Health gate
        run: |
          . .\.github\scripts\deploy-common.ps1
          $base = [int]$env:HEALTH_PORT_BASE
          foreach ($svc in $Services) {
            Wait-Health "http://localhost:$($base + $svc.PortOffset)/health" $svc.Name
          }

      - name: Prune old releases
        run: |
          . .\.github\scripts\deploy-common.ps1
          $keep = 3
          foreach ($svc in $Services) {
            $current = Get-CurrentTarget $svc
            Get-ChildItem (Join-Path (Get-SvcRoot $svc) 'releases') -Directory -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -like '*+*' } |
              Sort-Object CreationTime -Descending |
              Select-Object -Skip $keep |
              Where-Object { (Normalize-Path $_.FullName) -ne $current } |
              ForEach-Object {
                Write-Host "Pruning $($_.FullName)"
                Remove-Item $_.FullName -Recurse -Force
              }
          }

      # Diagnostics first (capture logs of the failed release), then roll back.
      - name: Failure diagnostics
        if: failure()
        uses: ./.github/actions/failure-diagnostics
        with:
          default_env_root: ${{ inputs.env_root }}

      - name: Rollback to previous release
        if: failure()
        run: |
          . .\.github\scripts\deploy-common.ps1
          if (-not (Test-Path $StateFile)) {
            Write-Host "No service was activated, nothing to roll back"
            exit 0
          }

          $state = Get-Content $StateFile -Raw | ConvertFrom-Json -AsHashtable
          foreach ($svc in $Services) {
            if (-not $state.ContainsKey($svc.Name)) { continue }
            $prev = $state[$svc.Name]
            if (-not $prev) {
              Write-Warning "$($svc.Name): no previous release to roll back to"
              continue
            }

            Write-Host "=== Rollback $($svc.Name) -> $prev ==="
            Stop-Svc $svc
            Set-CurrentJunction $svc $prev
            Start-Svc $svc
          }
