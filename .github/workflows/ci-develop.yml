name: CI (develop) - build & package

on:
  push:
    branches: ["develop"]
  pull_request:
    branches: ["develop"]

concurrency:
  # Prevent overlapping runs on the same branch from wasting the self-hosted runner
  group: ci-develop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Package (Windows self-hosted)
    runs-on: [self-hosted, windows]
    defaults:
      run:
       shell: powershell

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set build variables
        id: vars
        run: |
          # Short SHA used in artifact names
          $ShortSha = "${{ github.sha }}".Substring(0,7)
          "SHORT_SHA=$ShortSha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

          # Standard output folders inside the job workspace
          New-Item -ItemType Directory -Force -Path ".\_out\auth", ".\_out\pdf-renderer", ".\_out\text2image", ".\_zips" | Out-Null

      # -----------------------
      # AuthService (.NET)
      # -----------------------
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}\dotnet
          DOTNET_MULTILEVEL_LOOKUP: 0
        with:
          global-json-file: global.json

      - name: Restore (AuthService)
        run: |
          # Restore NuGet dependencies for AuthService
          dotnet restore ".\backend\auth\AuthService\AuthService.csproj"

      - name: Build (AuthService) - Release
        run: |
          # Build AuthService in Release mode (no restore, because it was already restored)
          dotnet build ".\backend\auth\AuthService\AuthService.csproj" -c Release --no-restore

      - name: Publish (AuthService) - Release
        run: |
          # Publish produces the deployable output folder (exe + deps)
          dotnet publish ".\backend\auth\AuthService\AuthService.csproj" -c Release --no-build -o ".\_out\auth\app"

      # -----------------------
      # PdfRendererService (.NET)
      # -----------------------
      - name: Restore (PdfRendererService)
        run: |
          # Restore NuGet dependencies for PdfRendererService
          dotnet restore ".\backend\pdf-renderer\PdfRendererService\PdfRendererService.csproj"

      - name: Build (PdfRendererService) - Release
        run: |
          # Build PdfRendererService in Release mode
          dotnet build ".\backend\pdf-renderer\PdfRendererService\PdfRendererService.csproj" -c Release --no-restore

      - name: Publish (PdfRendererService) - Release
        run: |
          # Publish produces the deployable output folder (exe + deps)
          dotnet publish ".\backend\pdf-renderer\PdfRendererService\PdfRendererService.csproj" -c Release --no-build -o ".\_out\pdf-renderer\app"

      # -----------------------
      # text2image (Python)
      # -----------------------
      - name: Verify Python matches .python-version
        shell: powershell
        run: |
          $expected = (Get-Content .python-version -Raw).Trim()
          $actual = (python -c "import platform; print(platform.python_version())").Trim()
          if ($expected -ne $actual) { throw "Python version mismatch. Expected $expected, got $actual" }

      - name: Validate text2image structure
        run: |
          # Fail fast if expected files are missing
          if (!(Test-Path ".\backend\text2image\requirements.txt")) { throw "Missing backend/text2image/requirements.txt" }
          if (!(Test-Path ".\backend\text2image\app\main.py")) { Write-Host "Note: app/main.py not found; verify your uvicorn entrypoint." }

      - name: Package source (text2image)
        run: |
          # Copy python service source + requirements into artifact output
          Copy-Item ".\backend\text2image\*" ".\_out\text2image" -Recurse -Force

      # -----------------------
      # Create ZIPs (Artifacts)
      # -----------------------
      - name: Create ZIP artifacts
        run: |
          # Zip each deployable unit separately
          Compress-Archive -Path ".\_out\auth\*"        -DestinationPath ".\_zips\AuthService-${{ steps.vars.outputs.SHORT_SHA }}.zip" -Force
          Compress-Archive -Path ".\_out\pdf-renderer\*" -DestinationPath ".\_zips\PdfRendererService-${{ steps.vars.outputs.SHORT_SHA }}.zip" -Force
          Compress-Archive -Path ".\_out\text2image\*"   -DestinationPath ".\_zips\text2image-${{ steps.vars.outputs.SHORT_SHA }}.zip" -Force

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          # One workflow run publishes three ZIPs
          name: develop-build-${{ github.run_number }}-${{ steps.vars.outputs.SHORT_SHA }}
          path: .\_zips\*.zip
          if-no-files-found: error
          retention-days: 14
